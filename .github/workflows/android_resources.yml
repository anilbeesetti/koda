name: Android resource parity

on:
  pull_request:
    branches: [android-studio]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/android_resources.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - extensions/test-extension/**
      - script/linux
      - script/download-wasi-sdk
      - script/test-android-resources
      - script/test-android-project-model
  push:
    branches: [android-studio]
    paths:
      - .github/workflows/android_resources.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - extensions/test-extension/**
      - script/linux
      - script/download-wasi-sdk
      - script/test-android-resources
      - script/test-android-project-model
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-resources-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
  RUST_BACKTRACE: '1'
  CC: clang
  CXX: clang++
  WGPU_BACKEND: vulkan
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g

defaults:
  run:
    shell: bash

jobs:
  resources:
    name: Rust resource tests and AGP 8.9.1 / 9.4.0 fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Initialize owned SDK, Gradle and artifact paths
        run: |
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nGRADLE_USER_HOME=%s\nRESOURCE_ARTIFACTS=%s\n' \
            "$RUNNER_TEMP/resource-android-sdk" "$RUNNER_TEMP/resource-android-sdk" \
            "$RUNNER_TEMP/resource-gradle-home" "$RUNNER_TEMP/resource-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/resource-artifacts"
      - name: Free runner disk space
        # This job installs its own checksum-pinned SDK under RUNNER_TEMP.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          resource_vulkan_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$resource_vulkan_icd"
          printf 'VK_DRIVER_FILES=%s\n' "$resource_vulkan_icd" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install WASI SDK and build the test extension
        run: |
          ./script/download-wasi-sdk
          cargo build --locked --manifest-path extensions/test-extension/Cargo.toml \
            --target wasm32-wasip2 --target-dir extensions/test-extension/target
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK and Gradle distributions
        # SDK, JVM and Gradle are required official execution runtimes. Fixture
        # construction, model validation and resource assertions remain Rust.
        run: |
          set -euo pipefail
          resource_tools="$RUNNER_TEMP/resource-toolchains"
          mkdir -p "$resource_tools" "$ANDROID_HOME/cmdline-tools" "$RESOURCE_ARTIFACTS"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$resource_tools/android-commandline-tools.zip"
          printf '%s  %s\n' \
            4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 \
            "$resource_tools/android-commandline-tools.zip" | sha256sum --check --strict
          unzip -q "$resource_tools/android-commandline-tools.zip" -d "$resource_tools/android-commandline-tools"
          mv "$resource_tools/android-commandline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/pinned"
          resource_sdkmanager="$ANDROID_HOME/cmdline-tools/pinned/bin/sdkmanager"
          "$resource_sdkmanager" --sdk_root="$ANDROID_HOME" --licenses <<'ANDROID_LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          ANDROID_LICENSES
          "$resource_sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' < /dev/null
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [[ "$("$JAVA_HOME/bin/javac" -version 2>&1)" == javac\ 21.* ]]
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output "$resource_tools/gradle-8.11.1-bin.zip"
          printf '%s  %s\n' \
            f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6 \
            "$resource_tools/gradle-8.11.1-bin.zip" | sha256sum --check --strict
          unzip -q "$resource_tools/gradle-8.11.1-bin.zip" -d "$resource_tools"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://services.gradle.org/distributions/gradle-9.6.1-bin.zip \
            --output "$resource_tools/gradle-9.6.1-bin.zip"
          printf '%s  %s\n' \
            9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14 \
            "$resource_tools/gradle-9.6.1-bin.zip" | sha256sum --check --strict
          unzip -q "$resource_tools/gradle-9.6.1-bin.zip" -d "$resource_tools"
          printf 'RESOURCE_GRADLE8=%s\nRESOURCE_GRADLE9=%s\n' \
            "$resource_tools/gradle-8.11.1/bin/gradle" \
            "$resource_tools/gradle-9.6.1/bin/gradle" >> "$GITHUB_ENV"
      - name: Compile actual Project, Editor and Rust probe targets
        run: |
          cargo test --locked -p project --features test-support --test integration --no-run
          cargo test --locked -p editor --features test-support --lib --no-run
          cargo test --locked -p android_tools --example resource_model_probe --no-run
      - name: Run Android tooling and all six Rust resource-probe tests
        run: |
          cargo test --locked -p android_tools --lib 2>&1 | tee "$RESOURCE_ARTIFACTS/android-tools-tests.log"
          cargo test --locked -p android_tools --example resource_model_probe 2>&1 | tee "$RESOURCE_ARTIFACTS/resource-probe-example-tests.log"
      - name: Run Project resource routing and small-budget regressions
        run: |
          cargo test --locked -p project --features test-support --lib android_resources \
            2>&1 | tee "$RESOURCE_ARTIFACTS/project-resource-unit-tests.log"
          cargo test --locked -p project --features test-support --test integration test_android_resource \
            2>&1 | tee "$RESOURCE_ARTIFACTS/project-resource-integration-tests.log"
      - name: Run preview save-state and Editor rename/navigation regressions
        run: |
          cargo test --locked -p android_ui --lib android_preview \
            2>&1 | tee "$RESOURCE_ARTIFACTS/preview-tests.log"
          cargo test --locked -p editor --features test-support --lib resource_rename \
            2>&1 | tee "$RESOURCE_ARTIFACTS/editor-resource-rename-tests.log"
          cargo test --locked -p editor --features test-support --lib navigation \
            2>&1 | tee "$RESOURCE_ARTIFACTS/editor-navigation-tests.log"
          cargo test --locked -p lsp_locations --lib \
            2>&1 | tee "$RESOURCE_ARTIFACTS/lsp-locations-tests.log"
      - name: Run all eleven Rust resource predicates against AGP 8.9.1
        run: |
          bash script/test-android-resources --gradle "$RESOURCE_GRADLE8" --sdk "$ANDROID_HOME" \
            --agp 8.9.1 --keep "$RESOURCE_ARTIFACTS/agp8-resources" \
            2>&1 | tee "$RESOURCE_ARTIFACTS/agp8-resource-probe.log"
      - name: Run all eleven Rust resource predicates against AGP 9.4.0
        run: |
          bash script/test-android-resources --gradle "$RESOURCE_GRADLE9" --sdk "$ANDROID_HOME" \
            --agp 9.4.0 --keep "$RESOURCE_ARTIFACTS/agp9-resources" \
            2>&1 | tee "$RESOURCE_ARTIFACTS/agp9-resource-probe.log"
      - name: Run retained shared project-model probes against both AGP versions
        # Existing Python shared-model probe remains unchanged; the new resource
        # probe above is Rust. Do not confuse fixture checks with AOSP parity.
        run: |
          python3 script/test-android-project-model --gradle "$RESOURCE_GRADLE8" --sdk "$ANDROID_HOME" \
            --agp 8.9.1 --keep "$RESOURCE_ARTIFACTS/agp8-model" \
            2>&1 | tee "$RESOURCE_ARTIFACTS/agp8-project-model-probe.log"
          python3 script/test-android-project-model --gradle "$RESOURCE_GRADLE9" --sdk "$ANDROID_HOME" \
            --agp 9.4.0 --keep "$RESOURCE_ARTIFACTS/agp9-model" \
            2>&1 | tee "$RESOURCE_ARTIFACTS/agp9-project-model-probe.log"
      - name: Retain focused test and fixture logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-resource-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          overwrite: false
