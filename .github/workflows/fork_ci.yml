name: Fork CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Formatting and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check fork workflow
        run: actionlint .github/workflows/fork_ci.yml
      - name: Check Android launcher and Kotlin scripts
        run: |
          if [[ -f script/android-ide ]]; then
            bash -n script/android-ide
          fi
          if [[ -f script/test-android-kotlin-installer ]]; then
            python3 script/test-android-kotlin-installer
          fi
          if [[ -f script/test-kotlin-lsp ]]; then
            python3 script/test-kotlin-lsp --self-test
          fi

  linux:
    name: Linux build and workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      WGPU_BACKEND: vulkan
    services:
      postgres:
        image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          vulkan_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-linux-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: fork-ci-linux-cargo-
      - name: Restore Linux build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            extensions/test-extension/target
          key: fork-ci-linux-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: fork-ci-linux-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build test extension
        run: >-
          cargo build --locked --manifest-path extensions/test-extension/Cargo.toml
          --target wasm32-wasip2 --target-dir extensions/test-extension/target
      - name: Build workspace tests
        run: cargo test --locked --workspace --no-run --keep-going
      - name: Run workspace tests
        run: >-
          cargo nextest run --locked --workspace --no-fail-fast --no-tests=warn
          --test-threads=2 --status-level=fail --final-status-level=fail
      - name: Build Zed
        if: success() || failure()
        run: cargo build --locked --keep-going -p zed --bin zed
      - name: Upload main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: zed-linux-${{ github.sha }}
          path: target/debug/zed
          if-no-files-found: error
          retention-days: 7
      - name: Save Linux build cache
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            extensions/test-extension/target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  macos:
    name: macOS application check
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-macos-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: fork-ci-macos-cargo-
      - name: Restore macOS build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: fork-ci-macos-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: fork-ci-macos-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
          xcrun --find metal
      - name: Check macOS Zed application
        run: cargo check --locked --keep-going -p zed --bin zed
      - name: Save macOS build cache
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
