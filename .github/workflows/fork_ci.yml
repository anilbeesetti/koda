name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Packaging-only changes are checked locally and by release runs.
    # Other changes always run checks; the planner selects native test coverage.
    paths-ignore:
      - .github/workflows/main_macos_release.yml
      - script/bundle-mac
      - script/create-macos-dmg
      - script/reserve-macos-release-version
      - script/publish-macos-release
      - script/tests/test_macos_*.py
  workflow_dispatch:
    inputs:
      strict_source_sha:
        description: 'Exact commit SHA for optional isolated Android IDE strict Clippy'
        required: false
        default: ''
        type: string
      strict_source_tree:
        description: 'Expected Git tree SHA for strict_source_sha; supply both inputs'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Formatting and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      native_checks: ${{ steps.plan.outputs.native_checks }}
      test_filter: ${{ steps.plan.outputs.test_filter }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch exact PR base for test planning
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
      - name: Plan native test coverage
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 script/ci-test-selection --event-name "$CI_EVENT_NAME"
          --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Test CI helpers
        run: python3 -m unittest discover -s script/tests -p 'test_ci_*.py'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check fork workflows
        run: actionlint
      - name: Check packaging identity and coexistence
        run: python3 -m unittest discover -s script/tests -p 'test_*.py'
      - name: Check Android launcher and Kotlin scripts
        run: |
          if [[ -f script/android-ide ]]; then
            bash -n script/android-ide
          fi
          if [[ -f script/test-android-kotlin-installer ]]; then
            python3 script/test-android-kotlin-installer
          fi
          if [[ -f script/test-kotlin-lsp ]]; then
            python3 script/test-kotlin-lsp --self-test
          fi

  linux:
    name: Linux build and workspace tests
    needs: checks
    if: needs.checks.outputs.native_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      WGPU_BACKEND: vulkan
      CI_TEST_FILTER: ${{ needs.checks.outputs.test_filter }}
      CI_TEST_MODE: ${{ needs.checks.outputs.mode }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select runner concurrency
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          vulkan_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Restore shared portable Cargo sources
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          # Identical relative paths keep archive contents and cache versions portable.
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install shared Cargo sources into original Cargo home
        id: materialize-sources
        if: steps.source-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python3 script/ci-source-cache restore
      - name: Restore legacy Cargo sources during cache migration
        id: legacy-source-cache
        if: steps.source-cache.outputs.cache-matched-key == '' || steps.materialize-sources.outcome == 'failure'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Prefetch locked Linux, Apple Silicon and WASI sources
        id: prefetch-sources
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 script/ci-run stage 'Cargo source union prefetch' -- python3 script/ci-source-cache prefetch
      - name: Restore Linux build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.a
            target/debug/deps/*.d
            extensions/test-extension/target/debug/.fingerprint
            extensions/test-extension/target/debug/build
            extensions/test-extension/target/debug/deps/*.rlib
            extensions/test-extension/target/debug/deps/*.rmeta
            extensions/test-extension/target/debug/deps/*.so
            extensions/test-extension/target/debug/deps/*.a
            extensions/test-extension/target/debug/deps/*.d
            extensions/test-extension/target/wasm32-wasip2/debug/.fingerprint
            extensions/test-extension/target/wasm32-wasip2/debug/build
            extensions/test-extension/target/wasm32-wasip2/debug/deps
            extensions/test-extension/target/wasm32-wasip2/debug/*.wasm
          key: fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Report cache reuse
        env:
          SOURCE_CACHE_HIT: ${{ steps.source-cache.outputs.cache-hit }}
          SOURCE_CACHE_KEY: ${{ steps.source-cache.outputs.cache-matched-key }}
          LEGACY_SOURCE_CACHE_KEY: ${{ steps.legacy-source-cache.outputs.cache-matched-key }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'Shared source exact hit: %s; shared key: %s; legacy source key: %s; build exact hit: %s; build key: %s\n' \
            "$SOURCE_CACHE_HIT" "$SOURCE_CACHE_KEY" "$LEGACY_SOURCE_CACHE_KEY" \
            "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build test extension
        run: >-
          python3 script/ci-run stage 'Test extension build' --
          cargo build --locked --manifest-path extensions/test-extension/Cargo.toml
          --target wasm32-wasip2 --target-dir extensions/test-extension/target
      - name: Build and run workspace tests
        run: |
          printf 'Test coverage: %s; filter: %s\n' "$CI_TEST_MODE" "$CI_TEST_FILTER"
          filter_args=()
          if [[ -n "$CI_TEST_FILTER" ]]; then
            filter_args=(-E "$CI_TEST_FILTER")
          fi
          python3 script/ci-run stage 'Workspace tests (build and execution)' -- \
            cargo nextest run --locked --workspace "${filter_args[@]}" --no-fail-fast --no-tests=warn \
            --test-threads "$CI_TEST_THREADS" --status-level=fail --final-status-level=fail
      - name: Build Zed
        if: success() || failure()
        run: python3 script/ci-run stage 'Linux app build' -- cargo build --locked --keep-going -p zed --bin koda
      - name: Stage portable Cargo sources
        id: stage-sources
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.prefetch-sources.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: python3 script/ci-source-cache stage
      - name: Save shared Cargo source cache (Linux main/manual writer)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.stage-sources.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Save Linux build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.a
            target/debug/deps/*.d
            extensions/test-extension/target/debug/.fingerprint
            extensions/test-extension/target/debug/build
            extensions/test-extension/target/debug/deps/*.rlib
            extensions/test-extension/target/debug/deps/*.rmeta
            extensions/test-extension/target/debug/deps/*.so
            extensions/test-extension/target/debug/deps/*.a
            extensions/test-extension/target/debug/deps/*.d
            extensions/test-extension/target/wasm32-wasip2/debug/.fingerprint
            extensions/test-extension/target/wasm32-wasip2/debug/build
            extensions/test-extension/target/wasm32-wasip2/debug/deps
            extensions/test-extension/target/wasm32-wasip2/debug/*.wasm
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  strict_android_ide_selection:
    name: Select isolated Android IDE strict source
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.strict_source_sha != '' || inputs.strict_source_tree != '')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'android-studio-task/1-evaluated-tree-isolated-strict-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Select exact head branch
        id: select
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
        run: |
          # GitHub expression equality ignores case; Bash preserves Git branch spelling.
          if [[ "$CI_EVENT_NAME" == 'pull_request' && "$CI_HEAD_REF" != 'android-studio-task/1-evaluated-tree-isolated-strict-ci' ]]; then
            echo 'selected=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'selected=true' >> "$GITHUB_OUTPUT"

  strict_android_ide:
    name: Isolated Android IDE strict Clippy
    needs: strict_android_ide_selection
    if: needs.strict_android_ide_selection.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      STRICT_SOURCE_SHA: ${{ github.event_name == 'pull_request' && 'bf7a2f4f1494985c941f7602ca719d9d7612c559' || inputs.strict_source_sha }}
      STRICT_SOURCE_TREE: ${{ github.event_name == 'pull_request' && 'bd6b6fd6612a520c39115fc69201e77d41fdbaf0' || inputs.strict_source_tree }}
    steps:
      - name: Validate exact source inputs
        run: |
          [[ "$STRICT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STRICT_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ env.STRICT_SOURCE_SHA }}
      - name: Verify source and frozen strict command
        env:
          CI_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          actual_source_sha=$(git rev-parse HEAD)
          actual_source_tree=$(git rev-parse 'HEAD^{tree}')
          tracked_status=$(git status --porcelain --untracked-files=no)
          test "$actual_source_sha" = "$STRICT_SOURCE_SHA"
          test "$actual_source_tree" = "$STRICT_SOURCE_TREE"
          test -z "$tracked_status"
          echo '0a2fa62c186e472ed7eb70f066d93d5b1e880d9d7e2c40b81f2a9e15544cfdb8  script/clippy' | sha256sum --check --strict
          printf 'Workflow commit: %s\nStrict source commit: %s\nStrict source tree: %s\n' \
            "$CI_WORKFLOW_SHA" "$STRICT_SOURCE_SHA" "$STRICT_SOURCE_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
      # Reuse the Linux job's bootstrap without its test services or build cache.
      - name: Select runner concurrency
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Verify source remains frozen
        run: |
          actual_source_sha=$(git rev-parse HEAD)
          actual_source_tree=$(git rev-parse 'HEAD^{tree}')
          tracked_status=$(git status --porcelain --untracked-files=no)
          test "$actual_source_sha" = "$STRICT_SOURCE_SHA"
          test "$actual_source_tree" = "$STRICT_SOURCE_TREE"
          test -z "$tracked_status"
          echo '0a2fa62c186e472ed7eb70f066d93d5b1e880d9d7e2c40b81f2a9e15544cfdb8  script/clippy' | sha256sum --check --strict
      - name: Run exact nine-crate strict Clippy
        run: >-
          ./script/clippy --locked -p android_tools -p android_ui -p command_palette
          -p fs -p gpui -p project -p title_bar -p workspace -p zed

  macos:
    name: macOS application check
    needs: checks
    if: needs.checks.outputs.native_checks == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select runner concurrency
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Restore shared portable Cargo sources
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          # Identical relative paths keep archive contents and cache versions portable.
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install shared Cargo sources into original Cargo home
        id: materialize-sources
        if: steps.source-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python3 script/ci-source-cache restore
      - name: Restore legacy Cargo sources during cache migration
        id: legacy-source-cache
        if: steps.source-cache.outputs.cache-matched-key == '' || steps.materialize-sources.outcome == 'failure'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore macOS build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.dylib
            target/debug/deps/*.a
            target/debug/deps/*.d
          key: fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Report cache reuse
        env:
          SOURCE_CACHE_HIT: ${{ steps.source-cache.outputs.cache-hit }}
          SOURCE_CACHE_KEY: ${{ steps.source-cache.outputs.cache-matched-key }}
          LEGACY_SOURCE_CACHE_KEY: ${{ steps.legacy-source-cache.outputs.cache-matched-key }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'Shared source exact hit: %s; shared key: %s; legacy source key: %s; build exact hit: %s; build key: %s\n' \
            "$SOURCE_CACHE_HIT" "$SOURCE_CACHE_KEY" "$LEGACY_SOURCE_CACHE_KEY" \
            "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
          xcrun --find metal
      - name: Check macOS Zed application
        run: python3 script/ci-run stage 'macOS app check' -- cargo check --locked --keep-going -p zed --bin koda
      - name: Save macOS build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.dylib
            target/debug/deps/*.a
            target/debug/deps/*.d
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  request_independent_controller_bootstrap:
    name: Request-independent exact controller Rust bootstrap
    # The existing opened/synchronize/reopened/ready_for_review PR events expose
    # labels. Root adds this label before an ordinary synchronize push; no new
    # labeled-event trigger, native Request or canonical manifest is required.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'native-controller-bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: 's'
      CARGO_PROFILE_DEV_STRIP: symbols
    steps:
      - name: Set runner-local Cargo target directory
        shell: bash
        run: |
          printf 'CARGO_TARGET_DIR=%s/native-independent-bootstrap-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact same-repository bootstrap controller head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap-control
          persist-credentials: false
      - name: Install controller-pinned bootstrap Rust toolchain
        working-directory: bootstrap-control
        run: rustup show active-toolchain
      - name: Record actual pinned bootstrap compiler and Cargo facts
        working-directory: bootstrap-control
        run: |
          rustc -vV
          cargo --version
      - name: Restore existing portable Cargo sources for independent bootstrap
        id: sources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('bootstrap-control/rust-toolchain.toml') }}-${{ hashFiles('bootstrap-control/Cargo.lock', 'bootstrap-control/extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('bootstrap-control/rust-toolchain.toml') }}-
      - name: Restore bootstrap sources into the original Cargo home
        if: steps.sources.outputs.cache-matched-key != ''
        working-directory: bootstrap-control
        run: python3 script/ci-source-cache restore --cache-dir ../.ci-cache/cargo-sources
      - name: Compile unaccepted Rust checkout constructor only
        id: constructor_compile
        working-directory: bootstrap-control
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-independent-constructor-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-independent-constructor-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Bind independent bootstrap controller tree
        id: bootstrap_tree
        working-directory: bootstrap-control
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Construct new exact controller source with Rust
        id: bootstrap_checkout
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROLLER_TREE: ${{ steps.bootstrap_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact prepare-bootstrap-checkout
          --source "$GITHUB_WORKSPACE/bootstrap-control" --sha "$CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --output-dir "$RUNNER_TEMP/owned-independent-bootstrap-controller"
          --receipt "$RUNNER_TEMP/owned-independent-bootstrap-checkout.json"
      - name: Compile export-candidate tool in the Rust-constructed exact checkout
        id: bootstrap_compile
        working-directory: ${{ runner.temp }}/owned-independent-bootstrap-controller
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-independent-bootstrap-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-independent-bootstrap-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Export request-independent controller bootstrap with Rust
        id: bootstrap_export
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROLLER_TREE: ${{ steps.bootstrap_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact export-bootstrap
          --source "$RUNNER_TEMP/owned-independent-bootstrap-controller" --sha "$CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --cargo-build-log "$RUNNER_TEMP/native-independent-bootstrap-build.jsonl"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output-dir "$RUNNER_TEMP/native-independent-controller-bootstrap"
      - name: Upload independently compiled bootstrap with separate artifact provenance
        id: bootstrap_upload
        if: steps.bootstrap_export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-native-controller-bootstrap-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-independent-controller-bootstrap/xtask
            ${{ runner.temp }}/native-independent-controller-bootstrap/bootstrap.json
            ${{ runner.temp }}/native-independent-controller-bootstrap/cargo-build.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain actual request-independent bootstrap boundary outcomes
        if: always()
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          ACTUAL_CONSTRUCTOR_COMPILE: ${{ steps.constructor_compile.outcome }}
          ACTUAL_CHECKOUT: ${{ steps.bootstrap_checkout.outcome }}
          ACTUAL_COMPILE: ${{ steps.bootstrap_compile.outcome }}
          ACTUAL_EXPORT: ${{ steps.bootstrap_export.outcome }}
          ACTUAL_UPLOAD: ${{ steps.bootstrap_upload.outcome }}
        run: |
          mkdir "$RUNNER_TEMP/native-independent-bootstrap-boundary"
          printf '{"state":"ACTUAL_REQUEST_INDEPENDENT_BOOTSTRAP_BOUNDARY_ZERO_ACCEPTANCE","controller_sha":"%s","run_id":"%s","run_attempt":"%s","constructor_compile_outcome":"%s","owned_checkout_outcome":"%s","compile_outcome":"%s","export_outcome":"%s","upload_outcome":"%s","native_request_required":false,"acceptance_credit":0}\n' "$CONTROLLER_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ACTUAL_CONSTRUCTOR_COMPILE" "$ACTUAL_CHECKOUT" "$ACTUAL_COMPILE" "$ACTUAL_EXPORT" "$ACTUAL_UPLOAD" > "$RUNNER_TEMP/native-independent-bootstrap-boundary/outcome.json"
      - name: Always upload bounded independent bootstrap compile failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-native-bootstrap-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-independent-bootstrap-boundary/outcome.json
            ${{ runner.temp }}/native-independent-constructor-build.jsonl
            ${{ runner.temp }}/native-independent-constructor-compile-exits.json
            ${{ runner.temp }}/owned-independent-bootstrap-checkout.json
            ${{ runner.temp }}/native-independent-bootstrap-build.jsonl
            ${{ runner.temp }}/native-independent-bootstrap-compile-exits.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  select_exact_native_artifact:
    name: Select exact same-repository native artifact source
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: 's'
      CARGO_PROFILE_DEV_STRIP: symbols
    outputs:
      selected: ${{ steps.select.outputs.selected || steps.presence.outputs.selected }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_tree: ${{ steps.select.outputs.source_tree }}
      source_manifest_sha256: ${{ steps.select.outputs.source_manifest_sha256 }}
      source_owner_receipt_sha256: ${{ steps.select.outputs.source_owner_receipt_sha256 }}
      request_sha256: ${{ steps.select.outputs.request_sha256 }}
    steps:
      - name: Set runner-local Cargo target directory
        shell: bash
        run: |
          printf 'CARGO_TARGET_DIR=%s/native-request-tool-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact PR controller head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - name: Avoid compiling optional tooling when the literal request is absent
        id: presence
        run: |
          if [[ ! -e control/.ci/native-artifact-request.json && ! -L control/.ci/native-artifact-request.json ]]; then
            printf 'selected=false\n' >> "$GITHUB_OUTPUT"
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Install controller-pinned Rust toolchain
        if: steps.presence.outputs.exists == 'true'
        working-directory: control
        run: rustup show active-toolchain
      - name: Restore existing portable Cargo sources for the Rust selector
        if: steps.presence.outputs.exists == 'true'
        id: sources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('control/rust-toolchain.toml') }}-${{ hashFiles('control/Cargo.lock', 'control/extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('control/rust-toolchain.toml') }}-
      - name: Restore portable sources into the original Cargo home
        if: steps.presence.outputs.exists == 'true' && steps.sources.outputs.cache-matched-key != ''
        working-directory: control
        run: python3 script/ci-source-cache restore --cache-dir ../.ci-cache/cargo-sources
      - name: Compile unaccepted Rust checkout constructor only
        id: constructor_compile
        if: steps.presence.outputs.exists == 'true'
        working-directory: control
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-controller-constructor-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-controller-constructor-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Bind exact controller tree
        if: steps.presence.outputs.exists == 'true'
        id: bootstrap_tree
        working-directory: control
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Construct new exact controller source with Rust
        if: steps.presence.outputs.exists == 'true'
        id: bootstrap_checkout
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROLLER_TREE: ${{ steps.bootstrap_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact prepare-bootstrap-checkout
          --source "$GITHUB_WORKSPACE/control" --sha "$CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --output-dir "$RUNNER_TEMP/owned-request-bootstrap-controller"
          --receipt "$RUNNER_TEMP/owned-request-bootstrap-checkout.json"
      - name: Compile export-candidate tool in the Rust-constructed exact checkout
        if: steps.presence.outputs.exists == 'true'
        id: bootstrap_compile
        working-directory: ${{ runner.temp }}/owned-request-bootstrap-controller
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-controller-bootstrap-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-controller-bootstrap-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Export bounded remotely compiled controller bootstrap with Rust
        if: steps.presence.outputs.exists == 'true'
        id: bootstrap_export
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROLLER_TREE: ${{ steps.bootstrap_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact export-bootstrap
          --source "$RUNNER_TEMP/owned-request-bootstrap-controller" --sha "$CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --cargo-build-log "$RUNNER_TEMP/native-controller-bootstrap-build.jsonl"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output-dir "$RUNNER_TEMP/native-controller-bootstrap"
      - name: Upload bounded controller bootstrap before app artifacts
        if: steps.bootstrap_export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-controller-bootstrap-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-controller-bootstrap/xtask
            ${{ runner.temp }}/native-controller-bootstrap/bootstrap.json
            ${{ runner.temp }}/native-controller-bootstrap/cargo-build.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Select bounded exact request with Rust
        if: steps.presence.outputs.exists == 'true'
        id: select
        env:
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact select-request
          --controller "$GITHUB_WORKSPACE/control" --controller-sha "$CONTROLLER_SHA"
          --repository "$GITHUB_REPOSITORY" --head-repository "$HEAD_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Retain actual controller bootstrap boundary outcome
        if: always() && steps.presence.outputs.exists == 'true'
        env:
          ACTUAL_CONSTRUCTOR_COMPILE: ${{ steps.constructor_compile.outcome }}
          ACTUAL_CHECKOUT: ${{ steps.bootstrap_checkout.outcome }}
          ACTUAL_COMPILE: ${{ steps.bootstrap_compile.outcome }}
          ACTUAL_EXPORT: ${{ steps.bootstrap_export.outcome }}
          CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir "$RUNNER_TEMP/native-bootstrap-boundary"
          printf '{"state":"ACTUAL_BOOTSTRAP_BOUNDARY_ZERO_ACCEPTANCE","controller_sha":"%s","run_id":"%s","run_attempt":"%s","constructor_compile_outcome":"%s","owned_checkout_outcome":"%s","compile_outcome":"%s","export_outcome":"%s","acceptance_credit":0}\n' "$CONTROLLER_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ACTUAL_CONSTRUCTOR_COMPILE" "$ACTUAL_CHECKOUT" "$ACTUAL_COMPILE" "$ACTUAL_EXPORT" > "$RUNNER_TEMP/native-bootstrap-boundary/outcome.json"
      - name: Always upload bounded actual controller compile failure evidence
        if: always() && steps.presence.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-controller-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-bootstrap-boundary/outcome.json
            ${{ runner.temp }}/native-controller-constructor-build.jsonl
            ${{ runner.temp }}/native-controller-constructor-compile-exits.json
            ${{ runner.temp }}/owned-request-bootstrap-checkout.json
            ${{ runner.temp }}/native-controller-bootstrap-build.jsonl
            ${{ runner.temp }}/native-controller-bootstrap-compile-exits.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  exact_source_native_artifact:
    name: Exact source native runtime artifact
    needs: select_exact_native_artifact
    if: needs.select_exact_native_artifact.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CC: clang
      CXX: clang++
      ZED_COMMIT_SHA: ${{ needs.select_exact_native_artifact.outputs.source_sha }}
      SOURCE_SHA: ${{ needs.select_exact_native_artifact.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.select_exact_native_artifact.outputs.source_tree }}
      SOURCE_MANIFEST_SHA256: ${{ needs.select_exact_native_artifact.outputs.source_manifest_sha256 }}
      REQUEST_SHA256: ${{ needs.select_exact_native_artifact.outputs.request_sha256 }}
      NATIVE_CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Set runner-local Cargo target directory
        shell: bash
        run: |
          printf 'CARGO_TARGET_DIR=%s/native-artifact-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout immutable controller
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - name: Checkout exact read-only Git object source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.select_exact_native_artifact.outputs.source_sha }}
          path: source-objects
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Install controller-pinned Rust toolchain
        working-directory: control
        run: rustup show active-toolchain
      - name: Restore controller portable Cargo sources
        id: controller_sources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('control/rust-toolchain.toml') }}-${{ hashFiles('control/Cargo.lock', 'control/extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('control/rust-toolchain.toml') }}-
      - name: Restore controller sources into original Cargo home
        if: steps.controller_sources.outputs.cache-matched-key != ''
        working-directory: control
        run: python3 script/ci-source-cache restore --cache-dir ../.ci-cache/cargo-sources
      - name: Compile unaccepted native-job checkout constructor only
        id: native_constructor_compile
        working-directory: control
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 's'
          CARGO_PROFILE_DEV_STRIP: symbols
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-app-constructor-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-app-constructor-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Bind native-job immutable controller tree
        id: native_controller_tree
        working-directory: control
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Construct new exact native-job controller with Rust
        id: native_controller_checkout
        env:
          CONTROLLER_TREE: ${{ steps.native_controller_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact prepare-bootstrap-checkout
          --source "$GITHUB_WORKSPACE/control" --sha "$NATIVE_CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --output-dir "$RUNNER_TEMP/owned-native-controller"
          --receipt "$RUNNER_TEMP/owned-native-controller-checkout.json"
      - name: Compile genuine second native-job controller tool in owned checkout
        id: controller_tool
        working-directory: ${{ runner.temp }}/owned-native-controller
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 's'
          CARGO_PROFILE_DEV_STRIP: symbols
        run: |
          set +e
          cargo build --locked -p xtask --bin xtask --message-format=json-render-diagnostics | head -c 4194304 > "$RUNNER_TEMP/native-app-controller-build.jsonl"
          actual_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"actual_cargo_exit":%s,"actual_capture_exit":%s,"maximum_log_bytes":4194304}\n' "${actual_status[0]}" "${actual_status[1]}" > "$RUNNER_TEMP/native-app-controller-compile-exits.json"
          test "${actual_status[0]}" -eq 0
          test "${actual_status[1]}" -eq 0
      - name: Bind bounded second controller artifact to owned controller source
        id: native_controller_export
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 's'
          CARGO_PROFILE_DEV_STRIP: symbols
          CONTROLLER_TREE: ${{ steps.native_controller_tree.outputs.tree }}
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact export-bootstrap
          --source "$RUNNER_TEMP/owned-native-controller" --sha "$NATIVE_CONTROLLER_SHA" --tree "$CONTROLLER_TREE"
          --cargo-build-log "$RUNNER_TEMP/native-app-controller-build.jsonl"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output-dir "$RUNNER_TEMP/native-app-controller-bootstrap"
      - name: Construct selected application source with Rust and preserve cold borrowed full13
        id: native_source_checkout
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact prepare-bootstrap-checkout
          --source "$GITHUB_WORKSPACE/source-objects" --sha "$SOURCE_SHA" --tree "$SOURCE_TREE"
          --output-dir "$RUNNER_TEMP/owned-native-source"
          --receipt "$RUNNER_TEMP/owned-native-source-checkout.json"
          --borrowed-physical-before "$RUNNER_TEMP/native-source-borrowed-before.json"
          --borrowed-physical-after "$RUNNER_TEMP/native-source-borrowed-after.json"
      - name: Run supplemental controller artifact-tooling tests
        working-directory: ${{ runner.temp }}/owned-native-controller
        run: >-
          cargo test --locked -p xtask tasks::native_artifact:: -- --test-threads=1
      - name: Verify full owned materialized source bytes modes blobs and tree
        id: native_source_verify
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact verify
          --source "$RUNNER_TEMP/owned-native-source" --sha "$SOURCE_SHA" --tree "$SOURCE_TREE"
          --manifest-sha256 "$SOURCE_MANIFEST_SHA256"
          --receipt "$RUNNER_TEMP/native-initial-source-observation.json"
      - name: Select unchanged bounded CI concurrency
        working-directory: ${{ runner.temp }}/owned-native-source
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Install unchanged Linux native bootstrap
        working-directory: ${{ runner.temp }}/owned-native-source
        run: ./script/linux
      - name: Install source-pinned Rust toolchain
        working-directory: ${{ runner.temp }}/owned-native-source
        run: rustup show active-toolchain
      - name: Restore selected-source portable Cargo sources
        id: sources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          # The canonical source digest binds both lockfiles and the toolchain;
          # hashFiles cannot authenticate a checkout outside GITHUB_WORKSPACE.
          key: fork-ci-native-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.select_exact_native_artifact.outputs.source_manifest_sha256 }}
          restore-keys: fork-ci-source-v3-shared-
      - name: Materialize portable sources in original Cargo home
        if: steps.sources.outputs.cache-matched-key != ''
        working-directory: ${{ runner.temp }}/owned-native-source
        run: python3 script/ci-source-cache restore --cache-dir "$GITHUB_WORKSPACE/.ci-cache/cargo-sources"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install unchanged WASI bootstrap
        working-directory: ${{ runner.temp }}/owned-native-source
        run: ./script/download-wasi-sdk
      - name: Build default-feature application and observe actual Cargo wait with Rust
        id: build
        run: >-
          "$CARGO_TARGET_DIR/debug/xtask" native-artifact build
          --source "$RUNNER_TEMP/owned-native-source" --sha "$SOURCE_SHA" --tree "$SOURCE_TREE"
          --request "$GITHUB_WORKSPACE/control/.ci/native-artifact-request.json"
          --request-sha256 "$REQUEST_SHA256" --controller-sha "$NATIVE_CONTROLLER_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output-dir "$RUNNER_TEMP/native-build-provenance" --github-output "$GITHUB_OUTPUT"
      - name: Bind package and split actual native artifact with Rust
        id: package
        env:
          BUILD_RECEIPT_SHA256: ${{ steps.build.outputs.native_build_receipt_sha256 }}
        run: >-
          sudo "$CARGO_TARGET_DIR/debug/xtask" native-artifact package
          --source "$RUNNER_TEMP/owned-native-source" --sha "$SOURCE_SHA" --tree "$SOURCE_TREE"
          --request "$GITHUB_WORKSPACE/control/.ci/native-artifact-request.json"
          --request-sha256 "$REQUEST_SHA256"
          --build-receipt "$RUNNER_TEMP/native-build-provenance/build-receipt.json"
          --build-receipt-sha256 "$BUILD_RECEIPT_SHA256"
          --output-dir "$RUNNER_TEMP/native-artifact"
      - name: Upload metadata before payload for bounded download planning
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-metadata-${{ needs.select_exact_native_artifact.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-artifact/artifact-metadata.json
            ${{ runner.temp }}/native-artifact/payload-manifest.json
            ${{ runner.temp }}/native-artifact/piece-manifest.json
            ${{ runner.temp }}/native-artifact/runtime/evidence/native-build.json
            ${{ runner.temp }}/native-artifact/runtime/evidence/source-manifest.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
      - name: Checkout immutable official artifact uploader
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02
          path: uploader
          persist-credentials: false
      - name: Upload one bounded ZIP per native payload piece
        uses: ./control/.github/actions/native-upload-pieces
        with:
          artifact-directory: ${{ runner.temp }}/native-artifact
          uploader-directory: ${{ github.workspace }}/uploader
          source-sha: ${{ needs.select_exact_native_artifact.outputs.source_sha }}

      - name: Retain actual application artifact boundary outcomes
        if: always()
        env:
          ACTUAL_CONSTRUCTOR: ${{ steps.native_constructor_compile.outcome }}
          ACTUAL_CONTROLLER_CHECKOUT: ${{ steps.native_controller_checkout.outcome }}
          ACTUAL_CONTROLLER_COMPILE: ${{ steps.controller_tool.outcome }}
          ACTUAL_CONTROLLER_EXPORT: ${{ steps.native_controller_export.outcome }}
          ACTUAL_SOURCE_CHECKOUT: ${{ steps.native_source_checkout.outcome }}
          ACTUAL_SOURCE_VERIFY: ${{ steps.native_source_verify.outcome }}
          ACTUAL_BUILD: ${{ steps.build.outcome }}
          ACTUAL_PACKAGE: ${{ steps.package.outcome }}
        run: |
          mkdir "$RUNNER_TEMP/native-failure-boundary"
          printf '{"state":"ACTUAL_NATIVE_OWNED_SOURCE_LIFECYCLE_ZERO_ACCEPTANCE","constructor":"%s","controller_checkout":"%s","second_compile":"%s","second_export":"%s","source_checkout":"%s","source_verify":"%s","acceptance_credit":0}\n' "$ACTUAL_CONSTRUCTOR" "$ACTUAL_CONTROLLER_CHECKOUT" "$ACTUAL_CONTROLLER_COMPILE" "$ACTUAL_CONTROLLER_EXPORT" "$ACTUAL_SOURCE_CHECKOUT" "$ACTUAL_SOURCE_VERIFY" > "$RUNNER_TEMP/native-failure-boundary/owned-source-outcome.json"
          printf '{"state":"ACTUAL_NATIVE_ARTIFACT_BOUNDARY_ZERO_ACCEPTANCE","source_sha":"%s","source_tree":"%s","controller_sha":"%s","run_id":"%s","run_attempt":"%s","build_outcome":"%s","package_outcome":"%s","acceptance_credit":0}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$NATIVE_CONTROLLER_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ACTUAL_BUILD" "$ACTUAL_PACKAGE" > "$RUNNER_TEMP/native-failure-boundary/outcome.json"
      - name: Export bounded actual source diagnostics and cleanup failures with Rust
        if: always() && steps.native_controller_export.outcome == 'success' && steps.native_source_checkout.outcome == 'success'
        env:
          ACTUAL_BUILD: ${{ steps.build.outcome }}
          ACTUAL_PACKAGE: ${{ steps.package.outcome }}
        run: >-
          sudo "$CARGO_TARGET_DIR/debug/xtask" native-artifact export-failure-evidence
          --source "$RUNNER_TEMP/owned-native-source" --sha "$SOURCE_SHA" --tree "$SOURCE_TREE"
          --request "$GITHUB_WORKSPACE/control/.ci/native-artifact-request.json" --request-sha256 "$REQUEST_SHA256"
          --build-dir "$RUNNER_TEMP/native-build-provenance" --package-dir "$RUNNER_TEMP/native-artifact"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --observed-build-step-conclusion "$ACTUAL_BUILD" --observed-package-step-conclusion "$ACTUAL_PACKAGE"
          --output-dir "$RUNNER_TEMP/native-failure-export"
      - name: Always upload bounded actual failure evidence while retaining the failing job conclusion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-failure-evidence-${{ needs.select_exact_native_artifact.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-failure-boundary/outcome.json
            ${{ runner.temp }}/native-failure-boundary/owned-source-outcome.json
            ${{ runner.temp }}/native-app-constructor-build.jsonl
            ${{ runner.temp }}/native-app-constructor-compile-exits.json
            ${{ runner.temp }}/owned-native-controller-checkout.json
            ${{ runner.temp }}/native-app-controller-build.jsonl
            ${{ runner.temp }}/native-app-controller-compile-exits.json
            ${{ runner.temp }}/native-app-controller-bootstrap/
            ${{ runner.temp }}/owned-native-source-checkout.json
            ${{ runner.temp }}/native-source-borrowed-before.json
            ${{ runner.temp }}/native-source-borrowed-after.json
            ${{ runner.temp }}/native-initial-source-observation.json
            ${{ runner.temp }}/native-failure-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
