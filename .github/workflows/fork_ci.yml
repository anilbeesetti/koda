name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Packaging-only changes are checked locally and by release runs.
    # Other changes always run checks; the planner selects native test coverage.
    paths-ignore:
      - .github/workflows/main_macos_release.yml
      - script/bundle-mac
      - script/create-macos-dmg
      - script/reserve-macos-release-version
      - script/publish-macos-release
      - script/tests/test_macos_*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Formatting and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      native_checks: ${{ steps.plan.outputs.native_checks }}
      test_filter: ${{ steps.plan.outputs.test_filter }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch exact PR base for test planning
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
      - name: Plan native test coverage
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 script/ci-test-selection --event-name "$CI_EVENT_NAME"
          --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Test CI helpers
        run: python3 -m unittest discover -s script/tests -p 'test_ci_*.py'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check fork workflows
        run: actionlint
      - name: Check packaging identity and coexistence
        run: python3 -m unittest discover -s script/tests -p 'test_*.py'
      - name: Check Android launcher and Kotlin scripts
        run: |
          if [[ -f script/android-ide ]]; then
            bash -n script/android-ide
          fi
          if [[ -f script/test-android-kotlin-installer ]]; then
            python3 script/test-android-kotlin-installer
          fi
          if [[ -f script/test-kotlin-lsp ]]; then
            python3 script/test-kotlin-lsp --self-test
          fi
      - name: Check production Kotlin Android import validator
        timeout-minutes: 10
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import runpy
          import stat
          import subprocess
          import tempfile
          import zipfile

          with tempfile.TemporaryDirectory(prefix="koda-import-contract-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              temporary = Path(temporary)
              os.environ["KODA_TOOL_DOWNLOADS"] = str(temporary / "downloads")
              installer = runpy.run_path("script/install-android-kotlin")
              download = installer["download"]
              download.__globals__.update(MAX_DOWNLOAD_BYTES=256 * 1024**2, DOWNLOAD_SECONDS=180)
              archive = download(
                  "gradle-9.6.1-bin.zip", "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip",
                  "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14",
              )
              with zipfile.ZipFile(archive) as distribution:
                  entries = distribution.infolist()
                  if len(entries) > 10_000 or sum(entry.file_size for entry in entries) > 1024**3:
                      raise RuntimeError("Gradle distribution exceeds extraction limits")
                  for entry in entries:
                      path = PurePosixPath(entry.filename)
                      mode = stat.S_IFMT(entry.external_attr >> 16)
                      if (path.is_absolute() or not path.parts or path.parts[0] != "gradle-9.6.1"
                              or ".." in path.parts or "\\" in entry.filename
                              or mode not in (0, stat.S_IFREG, stat.S_IFDIR)):
                          raise RuntimeError(f"Unsafe Gradle archive member: {entry.filename}")
                  distribution.extractall(temporary)
              subprocess.run([
                  "python3", "script/test-android-kotlin-importer",
                  "--gradle-home", str(temporary / "gradle-9.6.1"),
                  "--java-home", os.environ["JAVA_HOME_21_X64"],
              ], check=True, timeout=240)
          PY

  linux:
    name: Linux build and workspace tests
    needs: checks
    if: needs.checks.outputs.native_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      WGPU_BACKEND: vulkan
      CI_TEST_FILTER: ${{ needs.checks.outputs.test_filter }}
      CI_TEST_MODE: ${{ needs.checks.outputs.mode }}
    services:
      postgres:
        image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select runner concurrency
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install software graphics driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          vulkan_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Restore shared portable Cargo sources
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          # Identical relative paths keep archive contents and cache versions portable.
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install shared Cargo sources into original Cargo home
        id: materialize-sources
        if: steps.source-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python3 script/ci-source-cache restore
      - name: Restore legacy Cargo sources during cache migration
        id: legacy-source-cache
        if: steps.source-cache.outputs.cache-matched-key == '' || steps.materialize-sources.outcome == 'failure'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Prefetch locked Linux, Apple Silicon and WASI sources
        id: prefetch-sources
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 script/ci-run stage 'Cargo source union prefetch' -- python3 script/ci-source-cache prefetch
      - name: Restore Linux build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.a
            target/debug/deps/*.d
            extensions/test-extension/target/debug/.fingerprint
            extensions/test-extension/target/debug/build
            extensions/test-extension/target/debug/deps/*.rlib
            extensions/test-extension/target/debug/deps/*.rmeta
            extensions/test-extension/target/debug/deps/*.so
            extensions/test-extension/target/debug/deps/*.a
            extensions/test-extension/target/debug/deps/*.d
            extensions/test-extension/target/wasm32-wasip2/debug/.fingerprint
            extensions/test-extension/target/wasm32-wasip2/debug/build
            extensions/test-extension/target/wasm32-wasip2/debug/deps
            extensions/test-extension/target/wasm32-wasip2/debug/*.wasm
          key: fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Report cache reuse
        env:
          SOURCE_CACHE_HIT: ${{ steps.source-cache.outputs.cache-hit }}
          SOURCE_CACHE_KEY: ${{ steps.source-cache.outputs.cache-matched-key }}
          LEGACY_SOURCE_CACHE_KEY: ${{ steps.legacy-source-cache.outputs.cache-matched-key }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'Shared source exact hit: %s; shared key: %s; legacy source key: %s; build exact hit: %s; build key: %s\n' \
            "$SOURCE_CACHE_HIT" "$SOURCE_CACHE_KEY" "$LEGACY_SOURCE_CACHE_KEY" \
            "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build test extension
        run: >-
          python3 script/ci-run stage 'Test extension build' --
          cargo build --locked --manifest-path extensions/test-extension/Cargo.toml
          --target wasm32-wasip2 --target-dir extensions/test-extension/target
      - name: Build and run workspace tests
        run: |
          printf 'Test coverage: %s; filter: %s\n' "$CI_TEST_MODE" "$CI_TEST_FILTER"
          filter_args=()
          if [[ -n "$CI_TEST_FILTER" ]]; then
            filter_args=(-E "$CI_TEST_FILTER")
          fi
          python3 script/ci-run stage 'Workspace tests (build and execution)' -- \
            cargo nextest run --locked --workspace "${filter_args[@]}" --no-fail-fast --no-tests=warn \
            --test-threads "$CI_TEST_THREADS" --status-level=fail --final-status-level=fail
      - name: Build Zed
        if: success() || failure()
        run: python3 script/ci-run stage 'Linux app build' -- cargo build --locked --keep-going -p zed --bin koda
      - name: Stage portable Cargo sources
        id: stage-sources
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.prefetch-sources.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: python3 script/ci-source-cache stage
      - name: Save shared Cargo source cache (Linux main/manual writer)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.stage-sources.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Save Linux build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.a
            target/debug/deps/*.d
            extensions/test-extension/target/debug/.fingerprint
            extensions/test-extension/target/debug/build
            extensions/test-extension/target/debug/deps/*.rlib
            extensions/test-extension/target/debug/deps/*.rmeta
            extensions/test-extension/target/debug/deps/*.so
            extensions/test-extension/target/debug/deps/*.a
            extensions/test-extension/target/debug/deps/*.d
            extensions/test-extension/target/wasm32-wasip2/debug/.fingerprint
            extensions/test-extension/target/wasm32-wasip2/debug/build
            extensions/test-extension/target/wasm32-wasip2/debug/deps
            extensions/test-extension/target/wasm32-wasip2/debug/*.wasm
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  macos:
    name: macOS application check
    needs: checks
    if: needs.checks.outputs.native_checks == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select runner concurrency
        run: python3 script/ci-run resources --github-env "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Restore shared portable Cargo sources
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          # Identical relative paths keep archive contents and cache versions portable.
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install shared Cargo sources into original Cargo home
        id: materialize-sources
        if: steps.source-cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python3 script/ci-source-cache restore
      - name: Restore legacy Cargo sources during cache migration
        id: legacy-source-cache
        if: steps.source-cache.outputs.cache-matched-key == '' || steps.materialize-sources.outcome == 'failure'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fork-ci-source-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore macOS build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.dylib
            target/debug/deps/*.a
            target/debug/deps/*.d
          key: fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            fork-ci-build-v2-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-dev-debug0-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Report cache reuse
        env:
          SOURCE_CACHE_HIT: ${{ steps.source-cache.outputs.cache-hit }}
          SOURCE_CACHE_KEY: ${{ steps.source-cache.outputs.cache-matched-key }}
          LEGACY_SOURCE_CACHE_KEY: ${{ steps.legacy-source-cache.outputs.cache-matched-key }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'Shared source exact hit: %s; shared key: %s; legacy source key: %s; build exact hit: %s; build key: %s\n' \
            "$SOURCE_CACHE_HIT" "$SOURCE_CACHE_KEY" "$LEGACY_SOURCE_CACHE_KEY" \
            "$BUILD_CACHE_HIT" "$BUILD_CACHE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
          xcrun --find metal
      - name: Check macOS Zed application
        run: python3 script/ci-run stage 'macOS app check' -- cargo check --locked --keep-going -p zed --bin koda
      - name: Save macOS build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.dylib
            target/debug/deps/*.a
            target/debug/deps/*.d
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
