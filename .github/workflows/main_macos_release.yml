# Fork release workflow, maintained directly (not generated by cargo xtask).
name: Main macOS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each push gets its own run. A repository-wide concurrency group would discard
# pending pushes; the run ID only prevents overlapping retries of the same run.
concurrency:
  group: main-macos-release-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve timestamp tag for this commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/reserve-macos-release-version

  build:
    needs: version
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      ZED_BUNDLE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ZED_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ZED_GITHUB_REPOSITORY: ${{ github.repository }}
      ZED_COMMIT_SHA: ${{ github.sha }}
      TARGET_TRIPLE: aarch64-apple-darwin
      ARCHITECTURE: aarch64
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore shared Cargo sources (read-only)
        id: source_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          # Match Fork CI's literal paths and cross-OS archive version.
          path: |
            .ci-cache/cargo-sources/registry
            .ci-cache/cargo-sources/git
          enableCrossOsArchive: true
          key: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'extensions/test-extension/Cargo.lock') }}
          restore-keys: fork-ci-source-v3-shared-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Materialize Cargo sources with original timestamps
        if: steps.source_cache.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python3 script/ci-source-cache restore
      - name: Restore compiled Rust dependencies
        id: rust_build_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          # Preserve Cargo fingerprints, host proc macros and target libraries;
          # leave generated app bundles, DMGs and extracted symbols uncached.
          path: |
            target/macos-release-inputs.json
            target/release/.fingerprint
            target/release/build
            target/release/deps/*.rlib
            target/release/deps/*.rmeta
            target/release/deps/*.dylib
            target/release/deps/*.a
            target/release/deps/*.d
            target/aarch64-apple-darwin/release/.fingerprint
            target/aarch64-apple-darwin/release/build
            target/aarch64-apple-darwin/release/deps/*.rlib
            target/aarch64-apple-darwin/release/deps/*.rmeta
            target/aarch64-apple-darwin/release/deps/*.dylib
            target/aarch64-apple-darwin/release/deps/*.a
            target/aarch64-apple-darwin/release/deps/*.d
          key: macos15-aarch64-xcode16.4-release-v2-rust-${{ hashFiles('rust-toolchain.toml') }}-profile-${{ hashFiles('Cargo.toml', '.cargo/config.toml', '.cargo/bundle-config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos15-aarch64-xcode16.4-release-v2-rust-${{ hashFiles('rust-toolchain.toml') }}-profile-${{ hashFiles('Cargo.toml', '.cargo/config.toml', '.cargo/bundle-config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-
            macos15-aarch64-xcode16.4-release-v2-rust-${{ hashFiles('rust-toolchain.toml') }}-profile-${{ hashFiles('Cargo.toml', '.cargo/config.toml', '.cargo/bundle-config.toml') }}-
      - name: Restore legacy compiled dependencies during cache migration
        id: legacy_build_cache
        if: steps.rust_build_cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          # Preserve Cargo fingerprints, host proc macros and target libraries;
          # leave generated app bundles, DMGs and extracted symbols uncached.
          path: |
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/aarch64-apple-darwin/release/.fingerprint
            target/aarch64-apple-darwin/release/build
            target/aarch64-apple-darwin/release/deps
          key: macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-
            macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Restore exact release tool binaries
        id: release_tools_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: .ci-cache/macos-release-tools/bin
          key: macos-aarch64-xcode16.4-release-tools-v1-${{ hashFiles('rust-toolchain.toml', 'script/macos-release-tools') }}
      - name: Report release resources and cache reuse
        env:
          SOURCE_CACHE_KEY: ${{ steps.source_cache.outputs.cache-matched-key }}
          BUILD_CACHE_KEY: ${{ steps.rust_build_cache.outputs.cache-matched-key }}
          LEGACY_BUILD_CACHE_KEY: ${{ steps.legacy_build_cache.outputs.cache-matched-key }}
          TOOLS_CACHE_KEY: ${{ steps.release_tools_cache.outputs.cache-matched-key }}
        run: |
          python3 - <<'PYREPORT'
          import os, subprocess
          cpus = os.cpu_count()
          memory = int(subprocess.check_output(['sysctl', '-n', 'hw.memsize'], text=True))
          message = f'Release runner: {cpus} CPUs, {memory / 1024**3:.1f} GiB RAM; Cargo default jobs={cpus}'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(message + '\n')
              for name in ('SOURCE_CACHE_KEY', 'BUILD_CACHE_KEY', 'LEGACY_BUILD_CACHE_KEY', 'TOOLS_CACHE_KEY'):
                  output.write(f'- {name}: {os.environ[name] or "miss"}\n')
          PYREPORT
          vm_stat
      - name: Install build dependencies and Rust toolchain
        run: |
          python3 -m unittest discover -s script/tests -p 'test_macos_*.py'
          brew list cmake >/dev/null 2>&1 || brew install cmake
          rustup show
          ./script/download-wasi-sdk
      - name: Install and validate pinned release tools
        id: install_release_tools
        run: |
          python3 script/ci-run stage 'Release tools setup' -- python3 script/macos-release-tools --root .ci-cache/macos-release-tools
          printf '%s\n' "$GITHUB_WORKSPACE/.ci-cache/macos-release-tools/bin" >> "$GITHUB_PATH"
      - name: Save verified release tools before compiling the app
        if: ${{ !cancelled() && steps.install_release_tools.outcome == 'success' && steps.release_tools_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: .ci-cache/macos-release-tools/bin
          key: ${{ steps.release_tools_cache.outputs.cache-primary-key }}
      - name: Build optimized stable application and DMG
        env:
          ZED_BUNDLE_TIMINGS: '1'
          ZED_RELEASE_INPUTS_MANIFEST: target/macos-release-inputs.json
        run: |
          printf 'stable\n' > crates/zed/RELEASE_CHANNEL
          python3 script/ci-run stage 'Complete macOS production bundle' -- ./script/bundle-mac "$TARGET_TRIPLE"
          vm_stat
      - name: Verify app and collect release downloads
        run: |
          app="target/$TARGET_TRIPLE/release/dmg/Zed.app"
          test -x "$app/Contents/MacOS/zed"
          test -x "$app/Contents/MacOS/cli"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -Fx "$ZED_BUNDLE_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx "$ZED_BUNDLE_VERSION"
          lipo "$app/Contents/MacOS/zed" -verify_arch arm64
          "$app/Contents/MacOS/zed" --system-specs
          "$app/Contents/MacOS/cli" --version | grep -F "$ZED_BUNDLE_VERSION"
          mkdir -p release-assets
          cp "target/$TARGET_TRIPLE/release/Zed-$ARCHITECTURE.dmg" "release-assets/Zed-$ZED_BUNDLE_VERSION-macos-$ARCHITECTURE.dmg"
          cp "target/zed-remote-server-macos-$ARCHITECTURE.gz" "release-assets/zed-remote-server-$ZED_BUNDLE_VERSION-macos-$ARCHITECTURE.gz"
          (cd release-assets && shasum -a 256 ./* > "SHA256SUMS-macos-$ARCHITECTURE.txt")
      - name: Validate source snapshot after the production bundle succeeds
        id: validate_release_inputs
        run: python3 script/macos-release-inputs validate --manifest target/macos-release-inputs.json.pending --output target/macos-release-inputs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-aarch64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Save compiled Rust dependencies
        if: ${{ success() && steps.validate_release_inputs.outcome == 'success' && steps.rust_build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: |
            target/macos-release-inputs.json
            target/release/.fingerprint
            target/release/build
            target/release/deps/*.rlib
            target/release/deps/*.rmeta
            target/release/deps/*.dylib
            target/release/deps/*.a
            target/release/deps/*.d
            target/aarch64-apple-darwin/release/.fingerprint
            target/aarch64-apple-darwin/release/build
            target/aarch64-apple-darwin/release/deps/*.rlib
            target/aarch64-apple-darwin/release/deps/*.rmeta
            target/aarch64-apple-darwin/release/deps/*.dylib
            target/aarch64-apple-darwin/release/deps/*.a
            target/aarch64-apple-darwin/release/deps/*.d
          key: ${{ steps.rust_build_cache.outputs.cache-primary-key }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish Apple Silicon release after the build succeeds
        run: ./script/publish-macos-release
