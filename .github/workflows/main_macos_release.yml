# Fork release workflow, maintained directly (not generated by cargo xtask).
name: Main macOS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each push gets its own run. A repository-wide concurrency group would discard
# pending pushes; the run ID only prevents overlapping retries of the same run.
concurrency:
  group: main-macos-release-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve timestamp tag for this commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/reserve-macos-release-version

  build:
    needs: version
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      ZED_BUNDLE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ZED_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ZED_GITHUB_REPOSITORY: ${{ github.repository }}
      ZED_COMMIT_SHA: ${{ github.sha }}
      TARGET_TRIPLE: aarch64-apple-darwin
      ARCHITECTURE: aarch64
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore compiled Rust dependencies
        id: rust_build_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          # Preserve Cargo fingerprints, host proc macros and target libraries;
          # leave generated app bundles, DMGs and extracted symbols uncached.
          path: |
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/aarch64-apple-darwin/release/.fingerprint
            target/aarch64-apple-darwin/release/build
            target/aarch64-apple-darwin/release/deps
          key: koda-macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            koda-macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-lock-${{ hashFiles('Cargo.lock') }}-
            koda-macos-aarch64-xcode16.4-release-rust-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install build dependencies and Rust toolchain
        run: |
          python3 -m unittest discover -s script/tests -p 'test_macos_*.py'
          brew list cmake >/dev/null 2>&1 || brew install cmake
          rustup show
          ./script/download-wasi-sdk
      - name: Build optimized stable application and DMG
        run: |
          printf 'stable\n' > crates/zed/RELEASE_CHANNEL
          ./script/bundle-mac "$TARGET_TRIPLE"
      - name: Verify app and collect release downloads
        run: |
          app="target/$TARGET_TRIPLE/release/dmg/Koda.app"
          test -x "$app/Contents/MacOS/koda"
          test -x "$app/Contents/MacOS/cli"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'dev.anilbeesetti.koda'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist" | grep -Fx 'koda'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -Fx "$ZED_BUNDLE_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx "$ZED_BUNDLE_VERSION"
          lipo "$app/Contents/MacOS/koda" -verify_arch arm64
          "$app/Contents/MacOS/koda" --system-specs
          "$app/Contents/MacOS/cli" --version | grep -F "$ZED_BUNDLE_VERSION"
          mkdir -p release-assets
          cp "target/$TARGET_TRIPLE/release/Koda-$ARCHITECTURE.dmg" "release-assets/Koda-$ZED_BUNDLE_VERSION-macos-$ARCHITECTURE.dmg"
          cp "target/koda-remote-server-macos-$ARCHITECTURE.gz" "release-assets/koda-remote-server-$ZED_BUNDLE_VERSION-macos-$ARCHITECTURE.gz"
          (cd release-assets && shasum -a 256 ./* > "SHA256SUMS-macos-$ARCHITECTURE.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-aarch64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Save compiled Rust dependencies
        if: ${{ !cancelled() && steps.rust_build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: |
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/aarch64-apple-darwin/release/.fingerprint
            target/aarch64-apple-darwin/release/build
            target/aarch64-apple-darwin/release/deps
          key: ${{ steps.rust_build_cache.outputs.cache-primary-key }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish Apple Silicon release after the build succeeds
        run: ./script/publish-macos-release
