             generatedAssetsFolders: androidField('generatedAssetsFolders', paths),
             generatedClassPaths: field('generatedClassPaths', { values -> entries(values).collect { name, file ->
                 [name: name, path: file.canonicalPath]
             } }),
             classesFolders: field('classesFolders', paths),
             ideSetupTaskNames: field('ideSetupTaskNames', { values -> collection(values).collect { it } }),
             sourceGenTaskName: androidField('sourceGenTaskName', { it }),
             resGenTaskName: androidField('resGenTaskName', { it })]]
        }
        [module: project.path, directory: project.projectDir.canonicalPath, versions: versions,
         buildFolder: captured('BasicAndroidProject.buildFolder') {
             required(query('com.android.builder.model.v2.models.BasicAndroidProject'), 'buildFolder').canonicalPath
         },
         variants: captured('com.android.builder.model.v2.models.AndroidProject.variants') {
             def model = query('com.android.builder.model.v2.models.AndroidProject')
             collection(required(model, 'variants')).collect { value ->
                 [name: required(value, 'name'),
                  main: captured('Variant.mainArtifact') { artifact(required(value, 'mainArtifact'), 'android') },
                  hostTests: captured('Variant.hostTestArtifacts') { entries(required(value, 'hostTestArtifacts')).collect { name, entry ->
                      [artifact: name, value: artifact(entry, 'java')]
                  } },
                  deviceTests: captured('Variant.deviceTestArtifacts') { entries(required(value, 'deviceTestArtifacts')).collect { name, entry ->
                      [artifact: name, value: artifact(entry, 'android')]
                  } },
                  fixtures: captured('Variant.testFixturesArtifact') { artifact(required(value, 'testFixturesArtifact'), 'android') }]
             }
         }]
    }
    def defaultVariantSelection = { project, variants ->
        def multiplatform = multiplatformPaths.contains(project.path)
        def android = multiplatform ? null : project.extensions.getByName('android')
        def isDefault = { entry ->
            def value = optional(entry, 'isDefault')
            value instanceof org.gradle.api.provider.Provider ? value.getOrElse(false) : value == true
        }
        [multiplatform: multiplatform,
         preferredBuildTypes: multiplatform ? [] : android.buildTypes.findAll { isDefault(it) }*.name,
         preferredProductFlavors: multiplatform ? [] : android.productFlavors.findAll { isDefault(it) }*.name,
         variants: variants.collect { variant ->
             [name: variant.name, buildType: optional(variant, 'buildType'),
              productFlavors: (optional(variant, 'productFlavors') ?: []).collect { it.second }]
         }]
    }
    // Under parallel execution Gradle holds the task owner's project lock only.
    // Collect each module there, then aggregate plain data without resolving foreign configurations.
    def artifactModels = new java.util.concurrent.ConcurrentHashMap()
    def models = new java.util.concurrent.ConcurrentHashMap()
    def collectors = []
    androidVariants.each { path, variants ->
        def project = root.project(path)
        collectors.add(project.tasks.register('kodaAndroidModuleModel') {
            // AGP 8 forbids reading task-backed source providers until their producers finish.
            variants.each { variant ->
                def components = [variant, optional(variant, 'unitTest'), optional(variant, 'androidTest'), optional(variant, 'testFixtures')]
                components.addAll((optional(variant, 'hostTests') ?: [:]).values())
                components.addAll((optional(variant, 'deviceTests') ?: [:]).values())
                components.findAll { it != null }.unique { it.name }.each { component ->
                    ['java', 'kotlin', 'res', 'assets', 'manifests'].each { kind ->
                        def provider = optional(optional(component.sources, kind), 'all')
                        if (provider != null) inputs.files(provider)
                    }
                }
            }
            doLast {
                artifactModels[path] = generatedArtifacts(project)
                def catalog = sourceProviders(project)
                // Canonicalize configured paths once per module, not per variant/test component.
                def declaredAssetPaths = catalog == null ? null : catalog.providers.collectMany { provider ->
                    provider.roots.findAll { it.kind == 'assets' }*.path
                } as Set
                models[path] = [path: path, directory: project.projectDir.canonicalPath, namespace: multiplatformPaths.contains(path) ? variants.first().namespace.get() : project.extensions.getByName('android').namespace,
                 kind: androidKinds[path], sourceProviders: catalog, evaluatedProviders: evaluatedProviders(project, variants), defaultVariantSelection: defaultVariantSelection(project, variants), variants: variants.collect { variant ->
                    def components = [[component: variant, scope: 'main']]
                    def add = { component, scope -> if (component != null && !components.any { it.component.name == component.name }) components.add([component: component, scope: scope]) }
                    add(optional(variant, 'unitTest'), 'unitTest')
                    add(optional(variant, 'androidTest'), 'androidTest')
                    add(optional(variant, 'testFixtures'), 'testFixtures')
                    (optional(variant, 'hostTests') ?: [:]).values().each { add(it, 'unitTest') }
                    (optional(variant, 'deviceTests') ?: [:]).values().each { add(it, 'androidTest') }
                    def listing = null
                    if (androidKinds[path] == 'application') {
                        def artifacts = variant.artifacts
                        def artifactType = variant.class.classLoader.loadClass('com.android.build.api.artifact.SingleArtifact$APK')
                        def apk = artifacts.get(artifactType.getField('INSTANCE').get(null)).get().asFile
                        listing = new File(apk, 'output-metadata.json').canonicalPath
                    }
                    [name: variant.name, outputListing: listing, components: components.collect { entry ->
                        def graph = dependencies(project, configuration(project, entry.component))
                        if (entry.scope == 'main' && androidKinds[path] == 'application') {
                            (project.extensions.getByName('android').dynamicFeatures ?: []).each { feature ->
                                def expected = attributes(configuration(project, variant))
                                def candidates = (variantCatalog[feature] ?: []).findAll { it.attributes == expected }
                                if (candidates.size() != 1) throw new GradleException('Cannot map dynamic feature ' + feature + ' to ' + path + ':' + variant.name)
                                graph.add([kind: 'project', module: feature, variant: candidates.first().name])
                            }
                        }
                        [name: entry.component.name, namespace: optional(entry.component, 'namespace')?.get(), scope: entry.scope, sources: sources(project, entry.component, declaredAssetPaths), dependencies: graph.unique()]
                    }]
                 }]
            }
        })
    }
    jvmProjects.each { project ->
        collectors.add(project.tasks.register('kodaAndroidModuleModel') {
            project.extensions.getByName('sourceSets').findAll { it.name in ['main', 'test'] }.each { sourceSet ->
                // Source file trees carry the producer dependencies of task-backed JVM roots.
                inputs.files(sourceSet.java)
                def kotlin = optional(sourceSet, 'kotlin')
                if (kotlin != null) inputs.files(kotlin)
            }
            doLast {
                def sourceSets = project.extensions.getByName('sourceSets')
                def components = sourceSets.findAll { it.name in ['main', 'test'] }.collect { sourceSet ->
                    def roots = sourceSet.java.srcDirs.collect { [path: it.canonicalPath, kind: 'java', generated: it.toPath().startsWith(project.layout.buildDirectory.get().asFile.toPath())] }
                    def kotlin = optional(sourceSet, 'kotlin')
                    if (kotlin != null) roots.addAll(kotlin.srcDirs.collect { [path: it.canonicalPath, kind: 'kotlin', generated: it.toPath().startsWith(project.layout.buildDirectory.get().asFile.toPath())] })
                    [name: sourceSet.name, scope: sourceSet.name == 'main' ? 'main' : 'unitTest', sources: roots,
                     dependencies: dependencies(project, project.configurations.getByName(sourceSet.compileClasspathConfigurationName))]
                }
                models[project.path] = [path: project.path, directory: project.projectDir.canonicalPath, namespace: null, kind: 'jvm', variants: [[name: 'jvm', outputListing: null, components: components]]]
            }
        })
    }
    root.tasks.register('kodaAndroidProjectModel') {
        dependsOn(collectors)
        doLast {
            def modules = models.entrySet().sort { it.key }.collect { it.value }
            if (modules.size() != collectors.size()) throw new GradleException('Android module collection did not finish; sync again')
            def diagnostics = modules.any { it.kind == 'application' } ? [] : ['No runnable application module was found. Library-only builds are catalogued, but selecting an application target is currently required for language setup, build/run/debug, and previews.']
            def unknownProviders = modules.findAll { it.kind != 'jvm' && it.sourceProviders == null }*.path
            if (!unknownProviders.isEmpty()) diagnostics.add('Source-provider names are unavailable for ' + unknownProviders.join(', ') + '; Android tree annotations cannot be determined.')
            modules.findAll { it.evaluatedProviders?.status == 'unavailable' }.each { module ->
                diagnostics.add('Evaluated active providers are unavailable for ' + module.path + ': ' + module.evaluatedProviders.value.detail)
            }
            modules.findAll { it.evaluatedProviders?.status == 'available' && it.evaluatedProviders.value.nativeMembership == null }.each { module ->
                diagnostics.add('Native provider membership is unavailable for ' + module.path + '; Studio ordering remains a separate captured capability.')
            }
            sourceVersionFailures.entrySet().sort { it.key }.each { entry ->
                diagnostics.add('Legacy source-root augmentation is unavailable for ' + entry.key + '; direct source-provider roots were retained: ' + entry.value.result.value.detail)
            }
            modules.findAll { it.kind != 'jvm' }.each { module ->
                def version = kotlinModels[module.path].sdkPluginVersion
                if (version.result.status == 'unavailable') diagnostics.add('Kotlin SDK version is unavailable for ' + module.path + ': ' + version.result.value.detail)
            }
            println('KODA_ANDROID_PROJECT_MODEL=' + groovy.json.JsonOutput.toJson([version: 1, root: root.projectDir.canonicalPath, modules: modules, diagnostics: diagnostics,
                generatedArtifacts: [schema: 1, root: root.projectDir.canonicalPath, modules: modules.findAll { it.kind != 'jvm' }.collect { artifactModels[it.path] }],
                kotlinCapabilities: [schema: 1, root: root.projectDir.canonicalPath, modules: modules.findAll { it.kind != 'jvm' }.collect { kotlinModels[it.path] }],
                importFacts: [schema: 1, root: root.projectDir.canonicalPath, gradleVersion: gradle.getGradleVersion(),
                    modules: modules.collect { [module: it.path, directory: it.directory, kind: it.kind, variants: it.variants*.name] },
                    buildIdentity: importBuildIdentity, projectCatalogue: importCatalogue]]))
        }
    }
}
