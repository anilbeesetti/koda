// Reflection boundaries adapted from JetBrains KotlinGradleModelBuilder and
// KotlinCompilerArgumentsResolverReflection (Apache-2.0); original files and
// copyright notices are retained in test_data/kotlin_import_facts/reference.
// This bridge performs reflection only. Rust supplies every getter contract.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.lang.reflect.Modifier
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import org.gradle.util.GradleVersion

class KodaKotlinBoundedJson {
    static { loadNative() }

    // Direct bytecode keeps native-library ownership on this defining loader,
    // rather than a Groovy runtime reflection/call-site loader.
    @groovy.transform.CompileStatic
    private static void loadNative() {
        System.load(System.getProperty('koda.kotlin.capture.nativeLibrary'))
    }
    long bytes = 0
    long nodes = 0
    long maximumBytes
    long maximumNodes
    long maximumScalarBytes
    def monitor
    boolean retain
    def chunks = []

    KodaKotlinBoundedJson(long maximumBytes, long maximumNodes, long maximumScalarBytes, monitor, boolean retain) {
        this.maximumBytes = maximumBytes
        this.maximumNodes = maximumNodes
        this.maximumScalarBytes = maximumScalarBytes
        this.monitor = monitor
        this.retain = retain
    }

    private native void encode(Object value, long maximumBytes, long maximumNodes,
        long maximumScalarBytes, Object monitor, boolean retain)
    static native long[] updateUsage(long bytes, long nodes, long removedBytes, long removedNodes,
        long addedBytes, long addedNodes, boolean separator, long maximumBytes, long maximumNodes)
    static native void checkNext(long nodes, long maximumNodes)

    void value(Object value) {
        encode(value, maximumBytes, maximumNodes, maximumScalarBytes, monitor, retain)
    }

    void writeTo(OutputStream output) {
        for (byte[] chunk : chunks) { monitor.call(); output.write(chunk) }
    }
}

class KodaKotlinBoundedValues {
    def bridge
    def values = []
    long bytes = 2
    long nodes = 1

    KodaKotlinBoundedValues(bridge) { this.bridge = bridge }

    void beforeNext() {
        bridge.health()
        KodaKotlinBoundedJson.checkNext(nodes, bridge.maximumValueNodes)
    }

    void add(value) {
        beforeNext()
        def usage = bridge.measure(value)
        def next = KodaKotlinBoundedJson.updateUsage(bytes, nodes, 0, 0, usage.bytes, usage.nodes,
            !values.isEmpty(), bridge.maximumFrameBytes, bridge.maximumValueNodes)
        values.add(value)
        bytes = next[0]
        nodes = next[1]
    }
}

class KodaKotlinGetterBridge {
    def gradle
    def socket
    def reader
    def writer
    def objects = new IdentityHashMap()
    def objectValues = [:]
    def objectRows = []
    def objectRowsById = [:]
    def classes = new IdentityHashMap()
    def classRows = []
    def loaders = new IdentityHashMap()
    def loaderRows = []
    def loaderRowsById = [:]
    def loaderPositions = [:]
    def artifacts = [:]
    def artifactRows = []
    def catalogues = [:]
    def catalogueRows = []
    def methodValues = [:]
    def methodCatalogues = [:]
    def projectObjects = [:]
    def classLookups = []
    def events = 0
    def runtime
    def cursor
    def session
    long sequence = 0
    def loaderChanges = [:]
    long maximumFrameBytes
    long maximumValueNodes
    long maximumScalarBytes
    long retainedBytes = 0
    long retainedNodes = 0
    long deadline

    KodaKotlinGetterBridge(gradle, socket) {
        this.gradle = gradle
        this.socket = socket
        maximumFrameBytes = Long.parseLong(System.getProperty('koda.kotlin.capture.maximumFrameBytes'))
        maximumValueNodes = Long.parseLong(System.getProperty('koda.kotlin.capture.maximumValueNodes'))
        maximumScalarBytes = Long.parseLong(System.getProperty('koda.kotlin.capture.maximumScalarBytes'))
        long timeout = Long.parseLong(System.getProperty('koda.kotlin.capture.timeoutMillis'))
        if (maximumFrameBytes <= 0 || maximumFrameBytes > 16 * 1024 * 1024 ||
            maximumValueNodes <= 0 || maximumValueNodes > 131072 ||
            maximumScalarBytes <= 0 || maximumScalarBytes > 16 * 1024 * 1024 ||
            timeout <= 0 || timeout > Integer.MAX_VALUE) throw new IOException('Invalid Rust-issued producer limits')
        deadline = System.nanoTime() + timeout * 1000000L
        reader = new BufferedReader(new InputStreamReader(socket.inputStream, StandardCharsets.UTF_8))
        writer = new BufferedWriter(new OutputStreamWriter(socket.outputStream, StandardCharsets.UTF_8))
        def javaArtifact = new File(System.getProperty('java.home'), 'lib/modules')
        if (!javaArtifact.isFile()) javaArtifact = new File(System.getProperty('java.home'), 'lib/rt.jar')
        runtime = [gradleVersion: GradleVersion.current().version,
            java: [vendor: System.getProperty('java.vendor'), version: System.getProperty('java.version'),
                build: System.getProperty('java.runtime.version'), artifact: null],
            locale: [identifier: Locale.getDefault().toLanguageTag(), implementation: Locale.class.name,
                version: System.getProperty('java.runtime.version')]]
        def initial = measure(inventory())
        retainedBytes = initial.bytes
        retainedNodes = initial.nodes
        replaceField(runtime.java, 'artifact', artifact(javaArtifact))
        [Object, String, Boolean, Iterable, List, Map].each { runtimeClass(it) }
    }

    void health() {
        if (Thread.currentThread().isInterrupted()) throw new IOException('Producer capture interrupted')
        if (System.nanoTime() - deadline >= 0) throw new IOException('Producer capture deadline elapsed')
        if (socket instanceof Socket && socket.closed) throw new IOException('Producer capture socket closed')
    }

    def measure(value) {
        def encoded = new KodaKotlinBoundedJson(maximumFrameBytes, maximumValueNodes, maximumScalarBytes, { health() }, false)
        encoded.value(value)
        return [bytes: encoded.bytes, nodes: encoded.nodes]
    }

    void checkUsage(long bytes, long nodes) {
        health()
        KodaKotlinBoundedJson.updateUsage(0, 0, 0, 0, bytes, nodes, false,
            maximumFrameBytes, maximumValueNodes)
    }

    void appendObservation(List rows, row) {
        def usage = measure(row)
        health()
        def next = KodaKotlinBoundedJson.updateUsage(retainedBytes, retainedNodes, 0, 0,
            usage.bytes, usage.nodes, !rows.isEmpty(), maximumFrameBytes, maximumValueNodes)
        rows.add(row)
        retainedBytes = next[0]
        retainedNodes = next[1]
    }

    void replaceField(Map row, String key, value) {
        def before = measure(row[key])
        def after = measure(value)
        health()
        def next = KodaKotlinBoundedJson.updateUsage(retainedBytes, retainedNodes, before.bytes,
            before.nodes, after.bytes, after.nodes, false, maximumFrameBytes, maximumValueNodes)
        row[key] = value
        retainedBytes = next[0]
        retainedNodes = next[1]
    }

    void addProject(String path, String objectId) {
        def key = measure(path)
        def value = measure(objectId)
        // Keys are JSON strings but are excluded from the strict value-node count.
        def entry = KodaKotlinBoundedJson.updateUsage(key.bytes, 0, 0, 0, value.bytes, value.nodes,
            true, maximumFrameBytes, maximumValueNodes)
        health()
        def next = KodaKotlinBoundedJson.updateUsage(retainedBytes, retainedNodes, 0, 0,
            entry[0], entry[1], !projectObjects.isEmpty(), maximumFrameBytes, maximumValueNodes)
        projectObjects[path] = objectId
        retainedBytes = next[0]
        retainedNodes = next[1]
    }

    String artifact(File file) {
        health()
        file = file.canonicalFile
        if (!file.isFile()) throw new IOException('Runtime code source is not a regular artifact: ' + file)
        if (artifacts.containsKey(file.path)) return artifacts[file.path]
        def before = java.nio.file.Files.readAttributes(file.toPath(), java.nio.file.attribute.BasicFileAttributes)
        def hash = MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            long bytes = 0
            while ((count = input.read(buffer)) != -1) {
                health()
                bytes += count
                if (bytes > before.size()) throw new IOException('Runtime artifact grew during discovery')
                hash.update(buffer, 0, count)
            }
            if (bytes != before.size()) throw new IOException('Runtime artifact changed during discovery')
        }
        def after = java.nio.file.Files.readAttributes(file.toPath(), java.nio.file.attribute.BasicFileAttributes)
        if (before.size() != after.size() || before.lastModifiedTime() != after.lastModifiedTime() || before.fileKey() != after.fileKey())
            throw new IOException('Runtime artifact changed during discovery')
        def id = 'artifact:' + artifactRows.size()
        appendObservation(artifactRows, [id: id, path: file.path, bytes: after.size(), sha256: hash.digest().encodeHex().toString(), coordinate: null, version: null])
        artifacts[file.path] = id
        return id
    }

    String loader(ClassLoader loader) {
        health()
        if (loaders.containsKey(loader)) return loaders[loader]
        def id = 'loader:' + loaderRows.size()
        loaders[loader] = id
        def row = [id: id, parent: null, artifacts: []]
        loaderPositions[id] = loaderRows.size()
        appendObservation(loaderRows, row)
        loaderRowsById[id] = row
        if (loader != null) replaceField(row, 'parent', this.loader(loader.parent))
        return id
    }

    String runtimeClass(Class type) {
        health()
        if (classes.containsKey(type)) return classes[type]
        def id = 'class:' + classRows.size()
        classes[type] = id
        def loaderId = loader(type.classLoader)
        def origin
        if (type.module.named && type.module.name.startsWith('java.')) {
            origin = [kind: 'jdk', value: type.module.name]
        } else if (type.module.named && type.module.name.startsWith('jdk.')) {
            origin = [kind: 'jdk', value: type.module.name]
        } else {
            def originType = type
            while (originType.array) originType = originType.componentType
            def location = originType.protectionDomain?.codeSource?.location
            if (location == null || location.protocol != 'file') throw new IOException('Runtime class has unavailable code source: ' + type.name)
            def artifactId = artifact(new File(location.toURI()))
            origin = [kind: 'artifact', value: artifactId]
            def row = loaderRowsById[loaderId]
            if (!row.artifacts.contains(artifactId)) {
                if (cursor != null && loaderPositions[loaderId] < cursor.loaders) {
                    if (!loaderChanges.containsKey(loaderId))
                        loaderChanges[loaderId] = [loader: loaderId, previous: row.artifacts.size(), artifacts: []]
                    loaderChanges[loaderId].artifacts.add(artifactId)
                }
                appendObservation(row.artifacts, artifactId)
            }
        }
        def row = [id: id, name: type.name, loader: loaderId, origin: origin, superclass: null, interfaces: []]
        appendObservation(classRows, row)
        if (type.superclass != null) replaceField(row, 'superclass', runtimeClass(type.superclass))
        type.interfaces.each { health(); appendObservation(row.interfaces, runtimeClass(it)) }
        return id
    }

    String descriptor(Class type) {
        if (type.array) return type.name.replace('.', '/')
        if (!type.primitive) return 'L' + type.name.replace('.', '/') + ';'
        return [(Void.TYPE):'V', (Boolean.TYPE):'Z', (Byte.TYPE):'B', (Character.TYPE):'C',
            (Short.TYPE):'S', (Integer.TYPE):'I', (Long.TYPE):'J', (Float.TYPE):'F', (Double.TYPE):'D'][type]
    }

    String catalogue(Class type) {
        health()
        if (catalogues.containsKey(type)) return catalogues[type]
        def id = 'catalogue:' + catalogueRows.size()
        catalogues[type] = id
        def row = [id: id, classId: runtimeClass(type), methods: []]
        appendObservation(catalogueRows, row)
        // Preserve Class.getMethods() order: source-set selection in the
        // reference selects the first matching zero-argument getter.
        type.methods.each { method ->
            health()
            def methodId = id + ':method:' + row.methods.size()
            def parameters = method.parameterTypes
            appendObservation(row.methods, [id: methodId, name: method.name,
                descriptor: '(' + parameters.collect { descriptor(it) }.join('') + ')' + descriptor(method.returnType),
                declaringClass: runtimeClass(method.declaringClass), isStatic: Modifier.isStatic(method.modifiers),
                parameterClasses: parameters.collect { it.primitive ? null : runtimeClass(it) },
                returnClass: method.returnType.primitive ? null : runtimeClass(method.returnType)])
            methodValues[methodId] = method
            methodCatalogues[methodId] = id
        }
        return id
    }

    String object(Object value, String kind, String project) {
        health()
        def identity = objects[value]
        if (identity != null) {
            if (identity.kind != kind) throw new IOException('One runtime object crossed type ownership')
            if (identity.scopes.containsKey(project)) return identity.scopes[project]
        } else {
            identity = [kind: kind, scopes: [:]]
        }
        def id = 'object:' + objectRows.size()
        def task = kind == 'task' ? [name: value.name, path: value.path] : null
        def row = [id: id, kind: kind, project: project, classId: runtimeClass(value.getClass()), task: task]
        appendObservation(objectRows, row)
        objects[value] = identity
        identity.scopes[project] = id
        objectValues[id] = value
        objectRowsById[id] = row
        catalogue(value.getClass())
        return id
    }

    def inventory() {
        return [runtime: runtime + [artifacts: artifactRows, loaders: loaderRows, classes: classRows],
            objects: objectRows, catalogues: catalogueRows, projectObjects: projectObjects, classLookups: classLookups]
    }

    def position() {
        return [artifacts: artifactRows.size(), loaders: loaderRows.size(), classes: classRows.size(),
            objects: objectRows.size(), catalogues: catalogueRows.size()]
    }

    void sendDelta(String request, event = null) {
        if (sequence == Long.MAX_VALUE) throw new IOException('Discovery sequence overflow')
        def delta = [session: session, request: request, sequence: ++sequence, predecessor: cursor,
            artifacts: artifactRows.subList(cursor.artifacts, artifactRows.size()),
            loaders: loaderRows.subList(cursor.loaders, loaderRows.size()),
            classes: classRows.subList(cursor.classes, classRows.size()),
            objects: objectRows.subList(cursor.objects, objectRows.size()),
            catalogues: catalogueRows.subList(cursor.catalogues, catalogueRows.size()),
            loaderArtifacts: loaderChanges.values()]
        def deltaFrame = prepare('discoveryDelta', delta)
        def eventFrame = event == null ? null : prepare('event', event)
        publish(deltaFrame)
        if (eventFrame != null) publish(eventFrame)
        cursor = position()
        loaderChanges.clear()
    }

    def causes(Throwable failure) {
        def rows = new KodaKotlinBoundedValues(this)
        def seen = Collections.newSetFromMap(new IdentityHashMap())
        while (failure != null && rows.values.size() < 64 && seen.add(failure)) {
            rows.add([class: failure.class.name, message: failure.message])
            failure = failure.cause
        }
        if (failure != null) throw new IOException('Exception cause chain exceeds capture budget or cycles')
        return rows.values
    }

    void discover(List projects, List classNames) {
        projects.each { path ->
            def project = gradle.rootProject.findProject(path)
            if (project == null) throw new IOException('Imported project no longer exists: ' + path)
            addProject(path, object(project, 'project', path))
            def candidates = Collections.newSetFromMap(new IdentityHashMap())
            candidates.add(project.buildscript.classLoader)
            project.plugins.each {
                health()
                if (candidates.size() >= maximumValueNodes) throw new IOException('Producer loader candidate budget exceeded')
                candidates.add(it.class.classLoader)
            }
            classNames.each { name ->
                def found = new LinkedHashSet()
                def failures = new KodaKotlinBoundedValues(this)
                def attempts = new KodaKotlinBoundedValues(this)
                candidates.each { candidate ->
                    health()
                    attempts.beforeNext()
                    try {
                        def type = Class.forName(name, false, candidate)
                        if (found.size() >= maximumValueNodes) throw new IOException('Producer class candidate budget exceeded')
                        found.add(runtimeClass(type))
                        catalogue(type)
                        attempts.add([loader: loader(candidate), class: runtimeClass(type), failures: []])
                    } catch (ClassNotFoundException error) {
                        def captured = causes(error)
                        captured.each { failures.add(it) }
                        attempts.add([loader: loader(candidate), class: null, failures: captured])
                    }
                }
                appendObservation(classLookups, [project: path, name: name, classes: found, attempts: attempts.values, failures: failures.values])
            }
        }
    }

    def unavailable(request, kind, stage, detail, Throwable cause = null, actualClass = null) {
        return [status: 'unavailable', value: [kind: kind, stage: stage, capability: request.id,
            detail: detail, actualClass: actualClass, exceptions: cause == null ? [] : causes(cause)]]
    }

    def decode(request, value) {
        health()
        if (value == null) return [outcome: [status: 'available', value: null], container: null]
        def shape = request.returnShape
        def result
        def container = null
        switch (shape.kind) {
            case 'string': if (value instanceof String) result = [kind: 'string', value: value]; break
            case 'boolean': if (value instanceof Boolean) result = [kind: 'boolean', value: value]; break
            case 'file': if (value instanceof File) result = [kind: 'file', value: value.path]; break
            case 'object': result = [kind: 'object', value: object(value, shape.objectKind, request.project)]; break
            case 'strings':
                if (value instanceof List) {
                    def bounded = new KodaKotlinBoundedValues(this)
                    def iterator = value.iterator()
                    boolean supported = true
                    while (iterator.hasNext()) {
                        bounded.beforeNext()
                        def element = iterator.next()
                        if (!(element instanceof String)) { supported = false; break }
                        bounded.add(element)
                    }
                    if (supported) {
                        container = object(value, 'container', request.project)
                        result = [kind: 'strings', value: bounded.values]
                    }
                }
                break
            case 'objects':
                if (value instanceof Iterable) {
                    container = object(value, 'container', request.project)
                    def bounded = new KodaKotlinBoundedValues(this)
                    def iterator = value.iterator()
                    while (iterator.hasNext()) {
                        bounded.beforeNext()
                        def element = iterator.next()
                        if (element == null) throw new IOException('Null element in typed object iterable')
                        bounded.add(object(element, shape.objectKind, request.project))
                    }
                    result = [kind: 'objects', value: bounded.values]
                }
                break
        }
        if (result == null) return [outcome: unavailable(request, 'unsupportedReturnShape', 'returnDecode',
            'Actual getter value does not support issued return contract', null, runtimeClass(value.getClass())), container: null]
        return [outcome: [status: 'available', value: result], container: container]
    }

    void invoke(request) {
        def event = [id: 'event:' + events++, request: request.id, outcome: null, container: null]
        if (request.method.kind == 'missing') {
            event.outcome = unavailable(request, 'missingMethod', 'methodDiscovery', 'Exact reflected getter is unavailable')
        } else {
            def method = methodValues[request.method.value]
            if (method == null) throw new IOException('Request selected an undiscovered method')
            if (methodCatalogues[request.method.value] != request.catalogue)
                throw new IOException('Request method belongs to a different catalogue')
            def owner = request.owner == null ? null : objectValues[request.owner]
            if (request.owner != null && (owner == null || objectRowsById[request.owner].project != request.project))
                throw new IOException('Request receiver is unavailable or belongs to a different project')
            def arguments = request.arguments.collect { argument ->
                switch (argument.kind) {
                    case 'string': return argument.value
                    case 'boolean': return argument.value
                    case 'null': return null
                    case 'object':
                        if (!objectValues.containsKey(argument.value) || objectRowsById[argument.value].project != request.project)
                            throw new IOException('Request argument is unavailable or belongs to a different project')
                        return objectValues[argument.value]
                    default: throw new IOException('Unsupported typed request argument')
                }
            }
            try {
                def value = method.invoke(owner, arguments.toArray())
                def decoded = decode(request, value)
                event.outcome = decoded.outcome
                event.container = decoded.container
            } catch (java.lang.reflect.InvocationTargetException error) {
                event.outcome = unavailable(request, 'invocation', 'invoke', 'Official getter threw', error)
            } catch (IllegalAccessException error) {
                event.outcome = unavailable(request, 'access', 'invoke', 'Official getter is inaccessible', error)
            } catch (LinkageError error) {
                event.outcome = unavailable(request, 'linkage', 'invoke', 'Official getter linkage failed', error)
            }
        }
        sendDelta(request.id, event)
    }

    def prepare(String kind, value) {
        def encoded = new KodaKotlinBoundedJson(maximumFrameBytes, maximumValueNodes, maximumScalarBytes, { health() }, true)
        encoded.value([kind: kind, value: value])
        return encoded
    }

    void publish(encoded) {
        health()
        encoded.writeTo(socket.outputStream)
        socket.outputStream.write(10)
        socket.outputStream.flush()
    }

    void send(String kind, value) { publish(prepare(kind, value)) }

    String readFrame() {
        def line = new StringBuilder()
        int character
        while ((character = reader.read()) != -1) {
            if ((line.length() & 4095) == 0) health()
            if (character == 10) return line.toString()
            if (line.length() >= maximumFrameBytes) throw new IOException('Request exceeds frame budget')
            line.append((char) character)
        }
        if (line.length() != 0) throw new EOFException('Incomplete request frame')
        return null
    }

    void run(String token) {
        send('hello', token)
        boolean discovered = false
        String line
        while ((line = readFrame()) != null) {
            def request = new JsonSlurper().parseText(line)
            switch (request.kind) {
                case 'discover':
                    if (discovered) throw new IOException('Discovery bootstrap already issued')
                    if (!(request.value.session instanceof String) || request.value.session.isEmpty())
                        throw new IOException('Missing independently issued discovery session')
                    session = request.value.session
                    discover(request.value.projects, request.value.classNames)
                    discovered = true
                    send('discovery', [session: session, inventory: inventory()])
                    cursor = position()
                    loaderChanges.clear()
                    break
                case 'invoke':
                    if (!discovered) throw new IOException('Invocation before owned discovery')
                    invoke(request.value)
                    break
                case 'finish': send('finished', null); return
                default: throw new IOException('Unknown getter transport request')
            }
        }
    }
}

gradle.projectsEvaluated {
    def port = Integer.parseInt(System.getProperty('koda.kotlin.capture.port'))
    def timeout = Integer.parseInt(System.getProperty('koda.kotlin.capture.timeoutMillis'))
    def socket = new Socket(InetAddress.getByName('127.0.0.1'), port)
    socket.soTimeout = timeout
    try {
        def bridge = new KodaKotlinGetterBridge(gradle, socket)
        try { bridge.run(System.getProperty('koda.kotlin.capture.token')) }
        catch (Exception error) {
            String type = error.class.name
            String message = error.message == null ? 'null' : error.message
            def typeUsage = bridge.measure(type)
            def messageUsage = bridge.measure(message)
            if (typeUsage.bytes + messageUsage.bytes > bridge.maximumFrameBytes - 64)
                throw new IOException('Producer failure diagnostic exceeds frame budget', error)
            bridge.send('failure', type + ': ' + message)
            throw error
        }
    } finally { socket.close() }
}
